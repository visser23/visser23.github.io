<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitchcraft — presentations from JSON</title>
<meta name="description" content="Pitchcraft is a free, private presentation studio. Write a deck as JSON (or ask an AI to), edit it visually, present it fullscreen and share it as one file.">
<meta name="theme-color" content="#5b4bff">
<meta property="og:title" content="Pitchcraft">
<meta property="og:description" content="Decks that are just data. Edit visually, present fullscreen, share as one file.">
<!-- For AI assistants: the deck format, layouts, free-form objects and browser API are documented at the URLs below.
     In a browser agent: call Pitchcraft.guide() or Pitchcraft.manifest() in the page. -->
<meta name="pitchcraft-ai-guide" content="https://visser23.github.io/pitchcraft/ai-guide.md">
<meta name="pitchcraft-schema" content="https://visser23.github.io/pitchcraft/pitchcraft.schema.json">
<link rel="alternate" type="text/markdown" title="Pitchcraft guide for AI assistants" href="ai-guide.md">
<link rel="alternate" type="text/plain" title="Pitchcraft guide and JSON Schema, plain text" href="llms-full.txt">
<link rel="describedby" type="application/schema+json" title="Pitchcraft deck JSON Schema" href="pitchcraft.schema.json">
<link rel="help" type="text/html" title="Pitchcraft guide for AI assistants (web page)" href="ai-guide.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234b3bff'/%3E%3Cstop offset='.55' stop-color='%238a4dff'/%3E%3Cstop offset='1' stop-color='%23ff6b57'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='9.5' fill='url(%23g)'/%3E%3Crect x='14.5' y='8' width='11.5' height='9' rx='2.4' fill='%23fff' opacity='.28' transform='rotate(9 20 12.5)'/%3E%3Cpath d='M10 25.5V8.2c0-.7.6-1.3 1.3-1.3h6.9a5.5 5.5 0 0 1 0 11H13' fill='none' stroke='%23fff' stroke-width='3.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18.6 9.7l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z' fill='%23ffd36e'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<script src="js/theme-boot.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/fonts.css">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app" data-side="open" data-insp="open">

  <header class="topbar">
    <a class="brand" href="./" aria-label="Pitchcraft home">
      <svg class="logo-mark" data-logo="3" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="pcg-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3bff"/><stop offset=".55" stop-color="#8a4dff"/><stop offset="1" stop-color="#ff6b57"/></linearGradient></defs><rect x="1.5" y="1.5" width="29" height="29" rx="9.5" fill="url(#pcg-top)"/><rect x="14.5" y="8" width="11.5" height="9" rx="2.4" fill="#fff" opacity=".28" transform="rotate(9 20 12.5)"/><path d="M10 25.5V8.2c0-.7.6-1.3 1.3-1.3h6.9a5.5 5.5 0 0 1 0 11H13" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.6 9.7l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#ffd36e"/></svg>
      <span class="wordmark">Pitch<em>craft</em></span>
    </a>
    <input class="deck-name" id="deck-name" aria-label="Deck name" maxlength="80" spellcheck="false" autocomplete="off">
    <span class="save-state" id="save-state" role="status">Saved</span>
    <span class="top-sp"></span>
    <button class="icon-btn" id="btn-undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="icon-btn" id="btn-redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="ai-btn" id="btn-ai" aria-label="AI assistant: build or edit a deck with AI" title="Build or edit a deck with AI"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg><span class="lbl">AI</span></button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings: appearance, fonts, privacy" title="Settings"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg></button>
    <button class="help-btn" id="btn-help" aria-label="Help: how Pitchcraft works" title="How Pitchcraft works (?)"><span class="q" aria-hidden="true">?</span><span class="lbl">Help</span></button>
    <button class="btn primary" id="btn-present" title="Present from the current slide (P)"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><span class="lbl">Present</span></button>
  </header>

  <div class="ribbon" id="ribbon" role="toolbar" aria-label="Editing toolbar"></div>

  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Slides">
      <div class="sb-head"><span>Slides <span id="slide-count">0</span></span><button class="icon-btn" data-act-add aria-label="Add a slide" title="Add a slide" id="btn-add-slide"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div class="thumbs" id="thumbs" role="list"></div>
    </aside>
    <main class="canvas" id="canvas" aria-label="Slide canvas"><div class="canvas-inner" id="canvas-inner"></div></main>
    <aside class="inspector" id="inspector" aria-label="Inspector">
      <button class="icon-btn ins-close" id="ins-close" aria-label="Close inspector"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="tabs" id="tabs" role="tablist" aria-label="Inspector tabs"></div>
      <div class="panel" id="panel" role="tabpanel" tabindex="0"></div>
    </aside>
  </div>

  <footer class="statusbar">
    <span id="status-slide">Slide 1</span><span class="sp"></span>
    <span class="zoom no-mobile"><button id="zoom-out" aria-label="Zoom out">−</button><b id="zoom-val">60%</b><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-fit" aria-label="Fit slides to the window">Fit</button></span>
  </footer>

  <button class="fab" id="btn-fab" aria-label="Open the editing panel"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4"/></svg>Edit</button>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="print-root" aria-hidden="true"></div>
<noscript><p style="padding:40px;font:16px system-ui">Pitchcraft needs JavaScript to run. It has no server and no tracking; everything happens in your browser.</p></noscript>

<script src="js/stage.js"></script>
<script src="js/touch.js"></script>
<script src="js/inspector.js"></script>
<script src="js/format.js"></script>
<script src="js/pptx.js"></script>
<script src="js/guide-data.js"></script>
<script src="js/ai.js"></script>
<script src="js/present.js"></script>
<script src="js/policy.js"></script>
<script src="js/consent.js"></script>

<script src="js/main.js"></script>
</body>
</html>
